name: CI
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# One caller into the org's reusable, like every other workflow here. The sharded-test vertical
# itself is QAtlasHub/TestShards.jl.
#
# HOSTED runners, unlike the private repos in this fleet: this repository is PUBLIC, and the
# self-hosted pool refuses public-repository jobs. Both the shards and the merge jobs therefore
# say `ubuntu-latest` explicitly rather than taking the reusable's private-repo defaults.
#
# `contents: write` is NOT optional: a called workflow's jobs may not request more permission
# than the caller granted, the timing history is pushed to a `ci-timings` orphan branch, and
# granting less makes the run fail to START with no log to read.
jobs:
  ci:
    permissions:
      contents: write
    uses: lab-sotashimozono/.github/.github/workflows/julia-testshards.yml@main
    with:
      # 16 as before, so this PR moves one variable. The diagnosis printed on every run names
      # the knee for this suite; set what it says.
      shards: 16
      runner: '"ubuntu-latest"'
      helper-runner: '"ubuntu-latest"'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
